<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Inkward Bound｜Touch Interface</title>
    <script src="p5.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
  </head>
  <body>
    <div id="sketch-container"></div>

    <div id="sys-hud">
      <div class="sys-title">INKWARD BOUND&nbsp;&nbsp;|&nbsp;&nbsp;SYSTEM</div>
      <div class="sys-row">C-VALUE&nbsp;&nbsp;&nbsp;:&nbsp;<span id="sys-c">0.00</span></div>
      <div class="sys-row">STABILITY&nbsp;:&nbsp;<span id="sys-s">0.00</span></div>
      <div class="sys-row">AGITATION&nbsp;:&nbsp;<span id="sys-a">0.00</span></div>
      <div class="sys-row">DURATION&nbsp;&nbsp;:&nbsp;<span id="sys-d">0.0s</span></div>
      <div class="sys-state">STATE : <span id="sys-state">AUTONOMOUS DIFFUSION</span></div>
    </div>

    <div id="hud">
      <div id="ws-dot" class="try"></div>
      <span>C <span class="v" id="v-c">0.00</span></span>
      <span>STAB <span class="v" id="v-s">0.00</span></span>
      <span>AGIT <span class="v" id="v-a">0.00</span></span>
      <span>DUR <span class="v" id="v-d">0.0s</span></span>
      <div id="state-txt">AUTONOMOUS DIFFUSION</div>
    </div>

    <script src="sketch.js"></script>
  </body>
</html>

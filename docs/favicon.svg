<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The ink adapts to the browser tab's colour scheme: warm off-white on
       dark tabs, near-black on light ones. Colours match the site palette
       (ink #000, paper #f2f2f0). -->
  <style>
    .ink { fill: #0a0a0a }
    @media (prefers-color-scheme: dark) { .ink { fill: #f2f2f0 } }
  </style>
  <!-- The mark is a small density field: an asymmetric mass built from a few
       overlapping soft circles, plus a scatter of low-opacity satellite drops
       — the same operation the browser canvas performs at scale. -->
  <g class="ink">
    <circle cx="14" cy="15" r="8"/>
    <circle cx="18" cy="16" r="5.5"/>
    <circle cx="11" cy="19" r="3.5"/>
    <circle cx="20" cy="11" r="2.5"/>
    <circle cx="24" cy="8"  r="1"   opacity="0.7"/>
    <circle cx="26" cy="21" r="0.7" opacity="0.6"/>
    <circle cx="6"  cy="24" r="0.9" opacity="0.6"/>
    <circle cx="28" cy="14" r="0.5" opacity="0.5"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" font-family="'PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif">
  <style>
    .center{fill:#111;} .main{fill:#111;} .sub{fill:none;stroke:#111;stroke-width:1.5;}
    .ghost{fill:none;stroke:#999;stroke-width:1;}
    .tC{fill:#fff;font-size:30px;font-weight:700;text-anchor:middle;}
    .tM{fill:#fff;font-size:22px;font-weight:600;text-anchor:middle;}
    .tS{fill:#111;font-size:16px;text-anchor:middle;}
    .tG{fill:#777;font-size:13px;text-anchor:middle;}
    .ln{stroke:#111;stroke-width:2;fill:none;}
    .lnG{stroke:#aaa;stroke-width:1;fill:none;}
    .arrow{fill:#111;}
  </style>

  <!-- connectors center -> main nodes -->
  <line class="ln" x1="800" y1="510" x2="800" y2="365" stroke-width="10"/>
  <line class="ln" x1="800" y1="690" x2="800" y2="835" stroke-width="10"/>
  <line class="ln" x1="705" y1="600" x2="470" y2="600" stroke-width="10"/>
  <line class="ln" x1="895" y1="600" x2="1130" y2="600" stroke-width="10"/>
  <!-- bold arrows (like reference) -->
  <path class="arrow" d="M785 430 h30 l-15 -40 z"/>
  <path class="arrow" d="M785 770 h30 l-15 40 z"/>
  <path class="arrow" d="M540 585 v30 l-40 -15 z"/>
  <path class="arrow" d="M1060 585 v30 l40 -15 z"/>

  <!-- CENTER -->
  <circle class="center" cx="800" cy="600" r="92"/>
  <text class="tC" x="800" y="592">潜空间</text>
  <text class="tC" x="800" y="630">搜寻</text>

  <!-- TOP: media theory -->
  <circle class="main" cx="800" cy="300" r="66"/>
  <text class="tM" x="800" y="292">媒介理论</text><text class="tM" x="800" y="318">视角</text>
  <g>
    <line class="lnG" x1="800" y1="234" x2="470" y2="168"/><line class="lnG" x1="800" y1="234" x2="720" y2="160"/>
    <line class="lnG" x1="800" y1="234" x2="960" y2="160"/><line class="lnG" x1="800" y1="234" x2="1190" y2="168"/>
    <rect class="sub" x="360" y="140" width="220" height="46" rx="23"/><text class="tS" x="470" y="168">认知外包日常化</text>
    <rect class="sub" x="610" y="132" width="220" height="46" rx="23"/><text class="tS" x="720" y="160">注意力·记忆·判断被数据化</text>
    <rect class="sub" x="860" y="132" width="200" height="46" rx="23"/><text class="tS" x="960" y="160">内在经验碎片化</text>
    <rect class="ghost" x="1090" y="140" width="200" height="46" rx="23"/><text class="tG" x="1190" y="168">Stiegler 技术义肢 · Hayles 分布式认知</text>
  </g>

  <!-- BOTTOM: generative theory -->
  <circle class="main" cx="800" cy="900" r="66"/>
  <text class="tM" x="800" y="892">生成模型</text><text class="tM" x="800" y="918">理论</text>
  <g>
    <line class="lnG" x1="800" y1="966" x2="500" y2="1032"/><line class="lnG" x1="800" y1="966" x2="800" y2="1040"/>
    <line class="lnG" x1="800" y1="966" x2="1110" y2="1032"/>
    <rect class="sub" x="380" y="1010" width="240" height="46" rx="23"/><text class="tS" x="500" y="1038">扩散模型:噪声 → 形态</text>
    <rect class="sub" x="670" y="1018" width="260" height="46" rx="23"/><text class="tS" x="800" y="1046">潜空间 = 生成可能性的隐藏空间</text>
    <rect class="ghost" x="990" y="1010" width="240" height="46" rx="23"/><text class="tG" x="1110" y="1038">Rombach LDM · LoRA(Hu et al.)</text>
  </g>

  <!-- LEFT: phenomenology / body -->
  <circle class="main" cx="400" cy="600" r="66"/>
  <text class="tM" x="400" y="586">现象学</text><text class="tM" x="400" y="612">身体视角</text>
  <g>
    <line class="lnG" x1="334" y1="600" x2="230" y2="470"/><line class="lnG" x1="334" y1="600" x2="210" y2="600"/>
    <line class="lnG" x1="334" y1="600" x2="230" y2="730"/>
    <rect class="sub" x="60" y="442" width="220" height="46" rx="23"/><text class="tS" x="170" y="470">触摸 · 停留 · 耐心</text>
    <rect class="sub" x="40" y="572" width="240" height="46" rx="23"/><text class="tS" x="160" y="600">时延交互 vs 即时触发</text>
    <rect class="sub" x="50" y="702" width="240" height="46" rx="23"/><text class="tS" x="170" y="730">墨的物理性与意识同构</text>
  </g>

  <!-- RIGHT: C-value dimensions -->
  <circle class="main" cx="1200" cy="600" r="66"/>
  <text class="tM" x="1200" y="586">维度指标</text><text class="tM" x="1200" y="612">C 值</text>
  <g>
    <line class="lnG" x1="1266" y1="600" x2="1380" y2="440"/><line class="lnG" x1="1266" y1="600" x2="1400" y2="545"/>
    <line class="lnG" x1="1266" y1="600" x2="1400" y2="655"/><line class="lnG" x1="1266" y1="600" x2="1380" y2="760"/>
    <rect class="sub" x="1280" y="412" width="230" height="46" rx="23"/><text class="tS" x="1395" y="440">时长 = 信任的累积</text>
    <rect class="sub" x="1300" y="517" width="230" height="46" rx="23"/><text class="tS" x="1415" y="545">稳定度 = 在场的质量</text>
    <rect class="sub" x="1300" y="627" width="230" height="46" rx="23"/><text class="tS" x="1415" y="655">躁动度 = 离散的倾向</text>
    <rect class="sub" x="1280" y="732" width="230" height="46" rx="23"/><text class="tS" x="1395" y="760">一条轴:弥散 ↔ 凝结</text>
  </g>

  <!-- axis labels -->
  <text class="tG" x="800" y="470">意识为何出逃</text>
  <text class="tG" x="800" y="745">墨从哪里来</text>
  <text class="tG" x="588" y="570">身体如何搜寻</text>
  <text class="tG" x="1010" y="570">搜寻如何量化</text>
</svg>

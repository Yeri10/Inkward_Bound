<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" font-family="'PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif">
  <style>
    .center{fill:#111;} .main{fill:#111;} .sub{fill:none;stroke:#111;stroke-width:1.5;}
    .ghost{fill:none;stroke:#999;stroke-width:1;}
    .tC{fill:#fff;font-size:44px;font-weight:800;text-anchor:middle;}
    .tCe{fill:#bbb;font-size:13px;letter-spacing:2.5px;text-anchor:middle;}
    .tM{fill:#fff;font-size:22px;font-weight:600;text-anchor:middle;}
    .tS{fill:#111;font-size:16px;text-anchor:middle;}
    .tG{fill:#777;font-size:13px;text-anchor:middle;}
    .tLoop{fill:#555;font-size:14px;font-weight:600;text-anchor:middle;}
    .ln{stroke:#111;fill:none;}
    .lnG{stroke:#aaa;stroke-width:1;fill:none;}
    .arrow{fill:#111;}
    .loopRing{fill:none;stroke:#666;stroke-width:1.2;stroke-dasharray:5 5;}
  </style>

  <!-- opening question -->
  <text class="tG" x="800" y="60" font-size="18px">起点追问:当认知功能被委托给 AI 系统,内在经验会发生什么?</text>

  <!-- connectors center -> main nodes -->
  <line class="ln" x1="800" y1="480" x2="800" y2="365" stroke-width="10"/>
  <line class="ln" x1="800" y1="720" x2="800" y2="835" stroke-width="10"/>
  <line class="ln" x1="680" y1="600" x2="470" y2="600" stroke-width="10"/>
  <line class="ln" x1="920" y1="600" x2="1130" y2="600" stroke-width="10"/>
  <path class="arrow" d="M785 430 h30 l-15 -40 z"/>
  <path class="arrow" d="M785 770 h30 l-15 40 z"/>
  <path class="arrow" d="M540 585 v30 l-40 -15 z"/>
  <path class="arrow" d="M1060 585 v30 l40 -15 z"/>

  <!-- interaction loop ring around center -->
  <circle class="loopRing" cx="800" cy="600" r="155"/>
  <text class="tLoop" x="672" y="500">① 手</text>
  <text class="tLoop" x="930" y="500">② C 值</text>
  <text class="tLoop" x="945" y="712">③ 潜空间坐标</text>
  <text class="tLoop" x="668" y="712">④ 墨显形</text>

  <!-- CENTER: INK -->
  <circle class="center" cx="800" cy="600" r="100"/>
  <text class="tC" x="800" y="600">墨</text>
  <text class="tCe" x="800" y="636">INK · MEDIUM</text>
  <text x="800" y="664" fill="#bbb" font-size="15px" text-anchor="middle">让潜空间变得可见</text>
  <text class="tLoop" x="800" y="742" font-size="13px">Ink visualises the latent space</text>

  <!-- TOP: material metaphor -->
  <circle class="main" cx="800" cy="300" r="66"/>
  <text class="tM" x="800" y="292">物质</text><text class="tM" x="800" y="318">隐喻</text>
  <g>
    <line class="lnG" x1="800" y1="234" x2="450" y2="168"/><line class="lnG" x1="800" y1="234" x2="720" y2="160"/>
    <line class="lnG" x1="800" y1="234" x2="980" y2="160"/><line class="lnG" x1="800" y1="234" x2="1210" y2="168"/>
    <rect class="sub" x="340" y="140" width="220" height="46" rx="23"/><text class="tS" x="450" y="168">扩散 = 意识离散</text>
    <rect class="sub" x="610" y="132" width="220" height="46" rx="23"/><text class="tS" x="720" y="160">漂移 = 注意力游移</text>
    <rect class="sub" x="880" y="132" width="200" height="46" rx="23"/><text class="tS" x="980" y="160">聚拢 = 碎片重聚</text>
    <rect class="ghost" x="1110" y="140" width="200" height="46" rx="23"/><text class="tG" x="1210" y="168">意识出逃:Stiegler · Hayles</text>
  </g>

  <!-- RIGHT: technical isomorphism -->
  <circle class="main" cx="1200" cy="600" r="66"/>
  <text class="tM" x="1200" y="586">技术</text><text class="tM" x="1200" y="612">同构</text>
  <g>
    <line class="lnG" x1="1266" y1="600" x2="1380" y2="450"/><line class="lnG" x1="1266" y1="600" x2="1400" y2="560"/>
    <line class="lnG" x1="1266" y1="600" x2="1400" y2="670"/><line class="lnG" x1="1266" y1="600" x2="1380" y2="775"/>
    <rect class="sub" x="1270" y="422" width="240" height="46" rx="23"/><text class="tS" x="1390" y="450">扩散模型:噪声 → 形态</text>
    <rect class="sub" x="1290" y="532" width="250" height="46" rx="23"/><text class="tS" x="1415" y="560">潜空间 = 生成可能性空间</text>
    <rect class="sub" x="1290" y="642" width="250" height="46" rx="23"/><text class="tS" x="1415" y="670">C 值坐标:弥散 ↔ 凝结</text>
    <rect class="ghost" x="1270" y="747" width="230" height="46" rx="23"/><text class="tG" x="1385" y="775">Rombach LDM · LoRA(Hu et al.)</text>
  </g>

  <!-- BOTTOM: making tradition -->
  <circle class="main" cx="800" cy="900" r="66"/>
  <text class="tM" x="800" y="892">创作</text><text class="tM" x="800" y="918">传统</text>
  <g>
    <line class="lnG" x1="800" y1="966" x2="380" y2="1026"/><line class="lnG" x1="800" y1="966" x2="800" y2="1034"/>
    <line class="lnG" x1="800" y1="966" x2="1220" y2="1026"/>
    <rect class="sub" x="240" y="998" width="280" height="46" rx="23"/><text class="tS" x="380" y="1026">数据即材料:亲手拍摄 · 手工打标</text>
    <rect class="sub" x="660" y="1006" width="280" height="46" rx="23"/><text class="tS" x="800" y="1034">过程即作品:公开仓库与日志</text>
    <rect class="sub" x="1080" y="998" width="280" height="46" rx="23"/><text class="tS" x="1220" y="1026">时延即交互:以停留换取渐变</text>
    <line class="lnG" x1="380" y1="1044" x2="380" y2="1082"/><line class="lnG" x1="800" y1="1052" x2="800" y2="1082"/><line class="lnG" x1="1220" y1="1044" x2="1220" y2="1082"/>
    <rect class="ghost" x="260" y="1082" width="240" height="40" rx="20"/><text class="tG" x="380" y="1107">Ridler:数据 =「模型的 DNA」</text>
    <rect class="ghost" x="690" y="1082" width="220" height="40" rx="20"/><text class="tG" x="800" y="1107">Barr《The Artist Is Present 2》</text>
    <rect class="ghost" x="1100" y="1082" width="240" height="40" rx="20"/><text class="tG" x="1220" y="1107">在场与时延的交互艺术脉络</text>
  </g>

  <!-- LEFT: cultural carrier -->
  <circle class="main" cx="400" cy="600" r="66"/>
  <text class="tM" x="400" y="586">文化</text><text class="tM" x="400" y="612">载体</text>
  <g>
    <line class="lnG" x1="334" y1="600" x2="230" y2="470"/><line class="lnG" x1="334" y1="600" x2="210" y2="600"/>
    <line class="lnG" x1="334" y1="600" x2="230" y2="730"/>
    <rect class="sub" x="60" y="442" width="220" height="46" rx="23"/><text class="tS" x="170" y="470">书写 · 记忆 · 痕迹</text>
    <rect class="sub" x="40" y="572" width="240" height="46" rx="23"/><text class="tS" x="160" y="600">东西方共同的媒介</text>
    <rect class="sub" x="50" y="702" width="240" height="46" rx="23"/><text class="tS" x="170" y="730">让不可见变得可见</text>
  </g>

  <!-- axis questions -->
  <text class="tG" x="800" y="410">墨如何像意识</text>
  <text class="tG" x="800" y="800">墨如何被创作</text>
  <text class="tG" x="560" y="560">墨承载什么</text>
  <text class="tG" x="1042" y="560">墨如何像算法</text>
</svg>
